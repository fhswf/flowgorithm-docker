[supervisord]
nodaemon=true
silent=true

[program:xvfb]
command=Xvfb :0 -screen 0 "%(ENV_DISPLAY_WIDTH)s"x"%(ENV_DISPLAY_HEIGHT)s"x24 -listen tcp -ac
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :0 -forever -shared
autorestart=true
priority=20

[program:websockify]
command=websockify --web /usr/share/novnc 8080 localhost:5900
autorestart=true
priority=30

[program:openbox]
command=openbox-session
autorestart=true
priority=40
